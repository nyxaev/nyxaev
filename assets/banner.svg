<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <title>Isaac Moura · nyxaev</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#141A22"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1F262E"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>

    <!-- rede -->
    <g stroke="#2D343C" stroke-width="1" fill="none">
      <path d="M760 70 L860 140 L980 90 L1060 180 L940 220 L860 140"/>
      <path d="M700 160 L860 140"/>
      <path d="M820 240 L940 220"/>
      <path d="M940 220 L1060 180"/>
      <path d="M980 90 L1120 80"/>
    </g>

    <!-- nos pulsando -->
    <g fill="#586069">
      <circle cx="760" cy="70" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="140" r="5"><animate attributeName="opacity" values="1;0.35;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="90" r="4"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.6s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="180" r="4"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="220" r="5"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.4s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="240" r="3.5"><animate attributeName="opacity" values="1;0.35;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="80" r="3.5"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.4s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="160" r="3.5"><animate attributeName="opacity" values="1;0.35;1" dur="4.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- pacotes trafegando -->
    <circle r="3" fill="#3FB950">
      <animateMotion dur="5s" repeatCount="indefinite" path="M700 160 L860 140 L980 90 L1120 80"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#3FB950">
      <animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M820 240 L940 220 L1060 180"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" begin="-2s" repeatCount="indefinite"/>
    </circle>

    <!-- texto -->
    <g font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace">
      <text x="80" y="104" font-size="15" fill="#6E7681">~/nyxaev <tspan fill="#3FB950">$</tspan> whoami</text>

      <text x="80" y="176" font-size="58" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Isaac Moura<tspan fill="#3FB950" fill-opacity="1">▌<animate attributeName="fill-opacity" values="1;0" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>

      <text x="80" y="226" font-size="22" fill="#8B949E" opacity="0"><tspan fill="#3FB950">› </tspan>Backend + Mobile Developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="226" font-size="22" fill="#8B949E" opacity="0"><tspan fill="#3FB950">› </tspan>DevSecOps Tools Builder
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="226" font-size="22" fill="#8B949E" opacity="0"><tspan fill="#3FB950">› </tspan>Cybersecurity Student
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
      </text>

      <text x="80" y="272" font-size="13" fill="#484F58" letter-spacing="2">BACKEND · MOBILE · DEVSECOPS · CYBERSECURITY</text>
      <text x="1120" y="272" font-size="13" fill="#484F58" text-anchor="end" letter-spacing="1">@nyxaev</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="19.5" fill="none" stroke="#21262D"/>
</svg>
